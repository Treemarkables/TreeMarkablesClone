    <!-- iOS Capacitor FCM bridge: capture native token before React mounts -->
    <script>
      window.__pendingNativeFcmToken = null;
      window.addEventListener('nativeFcmToken', function(e) {
        window.__pendingNativeFcmToken = e.detail || null;
        console.log('[FCM] Native token captured early:', e.detail ? e.detail.substring(0, 20) + '...' : 'none');
      });

      // iOS Capacitor notification deep-link: capture the tapped destination
      // before React mounts. On a cold launch the native layer dispatches this
      // event during boot — earlier than the React listener exists — so we stash
      // it on a global and ack immediately. Acking stops the native side from
      // doing a full-page reload that would race the boot and land on the default
      // dashboard. App.tsx consumes __pendingNotificationPath once it mounts.
      // Preserve (don't wipe) a path the native layer may have injected before
      // this script executed — Swift's evaluateJavaScript can land mid-parse.
      window.__pendingNotificationPath = window.__pendingNotificationPath || null;
      window.addEventListener('nativeNotificationTap', function(e) {
        if (e && typeof e.detail === 'string' && e.detail) {
          window.__pendingNotificationPath = e.detail;
          try { window.dispatchEvent(new Event('nativeNotificationTapAck')); } catch (err) {}
          console.log('[Notif] Native tap path captured early:', e.detail);
        }
      });
    </script>
    <script>
      // Capacitor TestFlight cold-start watchdog. Runs BEFORE the React
      // bundle. If main.tsx never marks window.__INFLOW_BOOTED (hung first
      // load, dead JS, failed chunk), reload once so the user does not have
      // to force-quit. CSP already allows this inline script (Wave 1).
      (function () {
        window.__INFLOW_BOOTED = window.__INFLOW_BOOTED === true;
        window.__INFLOW_HEARTBEAT_MS = Date.now();
        var KEY = 'inflowBootReloadAttempts';
        var overlay = document.getElementById('inflow-boot');
        var retry = document.getElementById('inflow-boot-retry');
        function hideBoot() {
          window.__INFLOW_BOOTED = true;
          window.__INFLOW_HEARTBEAT_MS = Date.now();
          if (overlay) overlay.setAttribute('data-booted', '1');
        }
        window.addEventListener('inflow-booted', hideBoot);
        function attempts() {
          try {
            var parsed = JSON.parse(sessionStorage.getItem(KEY) || 'null');
            if (!parsed || typeof parsed.count !== 'number' || typeof parsed.at !== 'number') return 0;
            if (Date.now() - parsed.at > 180000) return 0;
            return parsed.count;
          } catch (e) { return 0; }
        }
        function reloadOnce() {
          if (window.__INFLOW_BOOTED) return;
          var n = attempts();
          if (n >= 2) {
            if (overlay) overlay.setAttribute('data-stuck', '1');
            return;
          }
          try { sessionStorage.setItem(KEY, JSON.stringify({ count: n + 1, at: Date.now() })); } catch (e) {}
          window.location.reload();
        }
        if (retry) retry.addEventListener('click', function () { window.location.reload(); });
        setTimeout(function () {
          if (!window.__INFLOW_BOOTED) reloadOnce();
        }, 18000);
      })();
    </script>
