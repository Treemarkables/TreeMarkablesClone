    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VK3PPB6SFW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VK3PPB6SFW');
    </script>
    
    <!-- Event snippet for Click to call conversion page -->
    <script>
    function gtag_report_conversion(url) {
      var callback = function () {
        if (typeof(url) != 'undefined') {
          window.location = url;
        }
      };
      gtag('event', 'conversion', {
          'send_to': 'AW-607851664/ohyNCIf4spwbEJCp7KEC',
          'value': 1.0,
          'currency': 'NZD',
          'event_callback': callback
      });
      return false;
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- PWA Cache Bypass: Pre-fetch diary data BEFORE React loads -->
    <!-- This runs before the cached bundle, bypassing service worker -->
    <script>
      (function() {
        console.log('🚀 PWA Bootstrap: Starting diary pre-fetch');
        
        // Check localStorage for last viewed job (GlobalJobCard stores this)
        var lastJobId = null;
        try {
          var stored = localStorage.getItem('lastViewedJobId');
          if (stored) {
            lastJobId = stored;
            console.log('📱 Found last viewed job:', lastJobId);
          }
        } catch (e) {
          console.log('⚠️ Cannot access localStorage');
        }
        
        if (lastJobId) {
          var timestamp = Date.now();
          
          console.log('📱 Bypassing service worker for job', lastJobId);
          
          // Fetch with cache-busting to bypass service worker completely
          fetch('/api/jobs/' + lastJobId + '/diary?pwa=1&ts=' + timestamp, {
            cache: 'reload',  // Force network, bypass all caches
            headers: {
              'X-Bypass-SW': '1',
              'Cache-Control': 'no-cache'
            }
          })
          .then(function(response) {
            console.log('✅ Bootstrap diary fetch:', response.status);
            return response.json();
          })
          .then(function(data) {
            console.log('✅ Bootstrap diary data:', data.data?.length, 'entries');
            // Store for React Query to use
            window.__DIARY_BOOTSTRAP__ = {
              jobId: lastJobId,
              data: data.data || [],
              timestamp: timestamp
            };
          })
          .catch(function(error) {
            console.error('❌ Bootstrap fetch failed:', error);
          });
        } else {
          console.log('ℹ️ No job to bootstrap');
        }
      })();
    </script>
    
    <script>
      // Diagnostic script to identify scroll blocker
      setTimeout(function() {
        console.log('=== SCROLL DIAGNOSTIC ===');
        const els = [document.documentElement, document.body, document.getElementById('root')];
        els.forEach(function(el, i) {
          if (!el) return;
          const s = window.getComputedStyle(el);
          const name = ['html', 'body', '#root'][i];
          console.log(name + ':', {
            overflow: s.overflow,
            overflowY: s.overflowY,
            height: s.height,
            maxHeight: s.maxHeight,
            position: s.position,
            touchAction: s.touchAction,
            scrollHeight: el.scrollHeight,
            clientHeight: el.clientHeight,
            canScroll: el.scrollHeight > el.clientHeight
          });
        });
        console.log('window.scrollY:', window.scrollY);
        window.scrollTo(0, 100);
        setTimeout(function() {
          console.log('After scroll attempt, window.scrollY:', window.scrollY);
        }, 100);
      }, 2000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
