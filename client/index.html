    <!-- iOS Capacitor FCM bridge: capture native token before React mounts -->
    <script>
      window.__pendingNativeFcmToken = null;
      window.addEventListener('nativeFcmToken', function(e) {
        window.__pendingNativeFcmToken = e.detail || null;
        console.log('[FCM] Native token captured early:', e.detail ? e.detail.substring(0, 20) + '...' : 'none');
      });

      // iOS Capacitor notification deep-link: capture the tapped destination
      // before React mounts. On a cold launch the native layer dispatches this
      // event during boot — earlier than the React listener exists — so we stash
      // it on a global and ack immediately. Acking stops the native side from
      // doing a full-page reload that would race the boot and land on the default
      // dashboard. App.tsx consumes __pendingNotificationPath once it mounts.
      // Preserve (don't wipe) a path the native layer may have injected before
      // this script executed — Swift's evaluateJavaScript can land mid-parse.
      window.__pendingNotificationPath = window.__pendingNotificationPath || null;
      window.addEventListener('nativeNotificationTap', function(e) {
        if (e && typeof e.detail === 'string' && e.detail) {
          window.__pendingNotificationPath = e.detail;
          try { window.dispatchEvent(new Event('nativeNotificationTapAck')); } catch (err) {}
          console.log('[Notif] Native tap path captured early:', e.detail);
        }
      });
    </script>
    <script>
      // Capacitor cold-start watchdog. Runs BEFORE the React bundle. A
      // text-less white card must not count as opened: that hid this cover
      // and the installed native probe reloaded the WebView white. If the
      // bundle never starts, cache-bust once. If there is still no real
      // screen, this cover becomes the error / Retry UI no matter what.
      (function () {
        window.__INFLOW_BOOTED = window.__INFLOW_BOOTED === true;
        window.__INFLOW_HEARTBEAT_MS = Date.now();
        window.__INFLOW_BOOT_ERROR = window.__INFLOW_BOOT_ERROR || '';
        var KEY = 'inflowBootReloadAttempts';
        var overlay = document.getElementById('inflow-boot');
        var retry = document.getElementById('inflow-boot-retry');
        var title = overlay ? overlay.querySelector('.boot-title') : null;
        var sub = overlay ? overlay.querySelector('.boot-sub') : null;
        function hideBoot() {
          window.__INFLOW_BOOTED = true;
          window.__INFLOW_HEARTBEAT_MS = Date.now();
          if (overlay) {
            overlay.setAttribute('data-booted', '1');
            overlay.removeAttribute('data-stuck');
          }
          try {
            window.webkit.messageHandlers.inflowBoot.postMessage({ type: 'appReady' });
          } catch (e) {}
        }
        window.addEventListener('inflow-booted', hideBoot);
        function realScreen() {
          var root = document.getElementById('root');
          if (!root) return false;
          // Marketing pages ship a static snapshot outside #root. That copy is
          // the page until React paints; don't reload it as a failed boot.
          var prerender = document.getElementById('tm-prerender');
          if (prerender) {
            var preText = ((prerender.innerText || '') + '').replace(/\s+/g, ' ').trim();
            if (preText) return true;
          }
          var main = root.querySelector('main');
          var scope = main || root;
          var text = ((scope.innerText || '') + '').replace(/\s+/g, ' ').trim();
          if (text && text !== 'Opening Inflow' && text.indexOf('Opening Inflow ') !== 0) return true;
          if (scope.querySelector('video, canvas, iframe, audio')) return true;
          var img = scope.querySelector('img');
          if (!img || !img.getBoundingClientRect) return false;
          var box = img.getBoundingClientRect();
          return box.width >= 2 && box.height >= 2;
        }
        function revealFailure(message) {
          if (realScreen()) {
            hideBoot();
            return;
          }
          window.__INFLOW_BOOTED = false;
          var text = message || window.__INFLOW_BOOT_ERROR || 'Inflow did not finish opening. Check your connection and try again.';
          if (overlay) {
            overlay.removeAttribute('data-booted');
            overlay.setAttribute('data-stuck', '1');
          }
          if (title) title.textContent = "Inflow didn't open";
          if (sub) sub.textContent = text;
          try {
            window.webkit.messageHandlers.inflowBoot.postMessage({ type: 'bootFailed', message: text });
          } catch (e) {}
        }
        function postClientError(message, stack) {
          try {
            fetch('/api/client-errors', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: message,
                stack: stack || '',
                componentStack: 'boot',
                url: location.href,
                userAgent: navigator.userAgent
              })
            });
          } catch (e) {}
        }
        function noteError(message, stack) {
          var text = message || 'Script error';
          window.__INFLOW_BOOT_ERROR = text;
          if (realScreen()) return;
          if (sub) sub.textContent = text;
          if (overlay) overlay.setAttribute('data-error', '1');
          postClientError(text, stack);
          try {
            window.webkit.messageHandlers.inflowBoot.postMessage({ type: 'bootError', message: text });
          } catch (e) {}
        }
        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || 'Script error';
          if (msg.indexOf('Script error') === 0 && !(event && event.filename)) return;
          noteError(msg, event && event.error && event.error.stack);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || String(reason || 'Unhandled rejection');
          noteError(msg, reason && reason.stack);
        });
        function attempts() {
          try {
            var parsed = JSON.parse(sessionStorage.getItem(KEY) || 'null');
            if (!parsed || typeof parsed.count !== 'number' || typeof parsed.at !== 'number') return 0;
            if (Date.now() - parsed.at > 180000) return 0;
            return parsed.count;
          } catch (e) { return 0; }
        }
        function cacheBust() {
          var url = new URL(location.href);
          url.searchParams.set('inflow_boot', String(Date.now()));
          location.replace(url.toString());
        }
        function reloadOnce() {
          if (realScreen()) {
            hideBoot();
            return;
          }
          var n = attempts();
          if (n >= 1) {
            revealFailure(window.__INFLOW_BOOT_ERROR);
            return;
          }
          try { sessionStorage.setItem(KEY, JSON.stringify({ count: n + 1, at: Date.now() })); } catch (e) {}
          cacheBust();
        }
        if (retry) retry.addEventListener('click', function () { cacheBust(); });
        function heartbeatAge() {
          var hb = window.__INFLOW_HEARTBEAT_MS || 0;
          if (!hb) return 999999;
          return Date.now() - hb;
        }
        // 12s with a stale heartbeat means the entry bundle never started
        // (stale index, missing chunk). A fresh heartbeat means JS is alive
        // and a slow route must not be cancelled.
        setTimeout(function () {
          if (realScreen()) return;
          if (heartbeatAge() < 8000) return;
          reloadOnce();
        }, 12000);
        // No matter the booted flag or a live heartbeat: if nothing real is
        // on screen, stop saying "Opening Inflow".
        setTimeout(function () {
          if (!realScreen()) revealFailure(window.__INFLOW_BOOT_ERROR);
        }, 20000);
        setInterval(function () {
          if (overlay && overlay.getAttribute('data-stuck') === '1' && realScreen()) hideBoot();
        }, 500);
      })();
    </script>
