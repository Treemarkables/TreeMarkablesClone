          window.location = url;

      gtag('event', 'conversion', {
          'send_to': 'AW-607851664/ohyNCIf4spwbEJCp7KEC',
          'value': 1.0,
          'currency': 'NZD',
          'event_callback': callback
      });
      return false;
    }
