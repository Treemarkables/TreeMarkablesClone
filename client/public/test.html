<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct React Test</title>
    <style>
        body { 
            margin: 0; 
            padding: 40px; 
            font-family: Arial, sans-serif; 
            background: #f8fafc; 
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .success { color: #059669; }
        .error { color: #dc2626; }
        .loading { color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌲 Direct React Test (No Vite)</h1>
        <div id="status" class="loading">Testing React without Vite plugins...</div>
        <div id="root"></div>
    </div>

    <!-- Use CDN React to bypass Vite entirely -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
        console.log('🚀 Direct React test starting...');
        
        const statusDiv = document.getElementById('status');
        const rootDiv = document.getElementById('root');
        
        try {
            // Check if React loaded
            if (typeof React === 'undefined') {
                throw new Error('React failed to load from CDN');
            }
            
            if (typeof ReactDOM === 'undefined') {
                throw new Error('ReactDOM failed to load from CDN');
            }
            
            statusDiv.innerHTML = '<span class="success">✅ React and ReactDOM loaded successfully!</span>';
            statusDiv.className = 'success';
            
            console.log('✅ React version:', React.version);
            console.log('✅ ReactDOM available:', !!ReactDOM.createRoot);
            
            // Create a simple React component
            const TestComponent = React.createElement('div', {
                style: {
                    padding: '20px',
                    backgroundColor: '#e8f5e8',
                    border: '2px solid #059669',
                    borderRadius: '8px',
                    margin: '20px 0'
                }
            }, [
                React.createElement('h2', { key: 'title' }, '🎉 React Works!'),
                React.createElement('p', { key: 'desc' }, 'This React component loaded successfully without Vite.'),
                React.createElement('p', { key: 'version' }, `React version: ${React.version}`)
            ]);
            
            // Render the component
            const root = ReactDOM.createRoot(rootDiv);
            root.render(TestComponent);
            
            console.log('✅ React component rendered successfully!');
            
        } catch (error) {
            console.error('❌ Direct React test failed:', error);
            statusDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            statusDiv.className = 'error';
            
            rootDiv.innerHTML = `
                <div style="background: #fef2f2; padding: 20px; border-radius: 8px; margin: 20px 0;">
                    <h3 style="color: #dc2626;">Direct React Test Failed</h3>
                    <p style="font-family: monospace; background: #fee; padding: 10px; border-radius: 4px;">${error.message}</p>
                    <p style="color: #666;">This test uses CDN React, completely bypassing Vite and all plugins.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
