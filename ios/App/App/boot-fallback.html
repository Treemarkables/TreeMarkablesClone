<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inflow didn't open</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a1a;
      color: #f5f5f0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 12px;
    }
    p {
      margin: 0;
      color: rgba(245, 245, 240, 0.75);
      white-space: pre-wrap;
      line-height: 1.4;
    }
    button {
      margin-top: 20px;
      color: #f5f5f0;
      background: transparent;
      border: 1px solid rgba(245, 245, 240, 0.35);
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Inflow didn't open</h1>
      <p id="boot-error">__BOOT_ERROR__</p>
      <button type="button" id="reload">Reload</button>
    </div>
  </main>
  <script>
    document.getElementById('reload').addEventListener('click', function () {
      try {
        window.webkit.messageHandlers.inflowBoot.postMessage({ type: 'reload' });
      } catch (e) {}
    });
  </script>
</body>
</html>
